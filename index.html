function criarQuestao(q) {

    let html = `
        <section class="questao">
            <h2>Questão ${q.id} - ${q.titulo}</h2>
            <p class="descricao">${q.descricao}</p>
            <div class="campos">
    `;

    q.campos.forEach(campo => {

        let id = campo[0];
        let tipo = campo[1];
        let placeholder = campo[2];

        if (tipo === "select") {

            html += `
                <select id="${id}">
                    <option value="">${placeholder}</option>
            `;

            campo[3].forEach(opcao => {

                html += `
                    <option value="${opcao}">${opcao}</option>
                `;

            });

            html += `</select>`;

        } else {

            html += `
                <input
                    id="${id}"
                    type="${tipo}"
                    placeholder="${placeholder}"
                >
            `;
        }

    });

    html += `
            </div>

            <button onclick="executar(${q.id})">
                Executar questão ${q.id}
            </button>

            <div class="resultado" id="resultado${q.id}">
                Resultado aparecerá aqui.
            </div>
        </section>
    `;

    return html;
}

function valor(id) {
    return document.getElementById(id).value;
}

function numero(id) {
    return Number(valor(id));
}

function listaNumeros(id) {
    return valor(id)
        .split(",")
        .map(x => Number(x.trim()))
        .filter(x => !Number.isNaN(x));
}

function listaTexto(id) {
    return valor(id)
        .split(",")
        .map(x => x.trim());
}

function resultado(id, texto) {
    document.getElementById("resultado" + id).textContent = texto;
}

function dinheiro(v) {
    return v.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

function executar(id) {

    switch(id) {

        case 1: {

            let consumo = numero("q1a");

            if (!Number.isFinite(consumo) || consumo < 0) {
                resultado(1, "Consumo inválido.");
                return;
            }

            let faixa;

            if (consumo <= 100)
                faixa = "Baixo";
            else if (consumo <= 250)
                faixa = "Moderado";
            else if (consumo <= 500)
                faixa = "Alto";
            else
                faixa = "Muito alto";

            let mensagem =
                faixa === "Baixo"
                    ? "Consumo controlado."
                    : faixa === "Moderado"
                    ? "Consumo moderado. Avalie formas de economia."
                    : faixa === "Alto"
                    ? "Consumo alto. Procure reduzir desperdícios."
                    : "Consumo muito alto. Recomenda-se uma análise detalhada.";

            resultado(
                1,
                `Classificação: ${faixa}\n${mensagem}`
            );

            break;
        }

        case 2: {

            let media = numero("q2a");
            let frequencia = numero("q2b");
            let renda = numero("q2c");

            if (
                media < 0 ||
                media > 10 ||
                frequencia < 0 ||
                frequencia > 100 ||
                renda < 0
            ) {
                resultado(2, "Dados inválidos.");
                return;
            }

            let okMedia = media >= 7;
            let okFrequencia = frequencia >= 75;
            let okRenda = renda <= 1500;

            let problemas = [];

            if (!okMedia)
                problemas.push("média");

            if (!okFrequencia)
                problemas.push("frequência");

            if (!okRenda)
                problemas.push("renda");

            if (problemas.length === 0) {

                resultado(
                    2,
                    "Resultado: ELEGÍVEL.\nTodos os critérios foram atendidos."
                );

            } else if (problemas.length === 1) {

                resultado(
                    2,
                    "Resultado: ANÁLISE COMPLEMENTAR.\nCritério não atendido: " +
                    problemas[0]
                );

            } else {

                resultado(
                    2,
                    "Resultado: NÃO ELEGÍVEL.\nCritérios não atendidos: " +
                    problemas.join(", ")
                );
            }

            break;
        }

        case 3: {

            let idade = numero("q3a");
            let prioridade = valor("q3b");

            if (
                idade < 0 ||
                idade > 120 ||
                !prioridade
            ) {
                resultado(3, "Dados inválidos.");
                return;
            }

            let classificacao;

            if (
                prioridade === "sim" &&
                idade >= 60
            ) {

                classificacao = "Alta prioridade";

            } else if (
                prioridade === "sim" ||
                idade >= 60
            ) {

                classificacao = "Média prioridade";

            } else {

                classificacao = "Baixa prioridade";
            }

            resultado(3, classificacao);

            break;
        }

        case 4: {

            let matricula = valor("q4a");
            let treinamento = valor("q4b");
            let hora = numero("q4c");

            if (
                !matricula ||
                !treinamento ||
                hora < 0 ||
                hora > 23
            ) {
                resultado(4, "Dados inválidos.");
                return;
            }

            if (
                matricula === "sim" &&
                treinamento === "sim" &&
                hora >= 8 &&
                hora < 18
            ) {

                resultado(4, "ACESSO AUTORIZADO.");

            } else if (
                matricula === "sim" &&
                treinamento === "sim"
            ) {

                resultado(4, "ACESSO RECUSADO POR HORÁRIO.");

            } else {

                resultado(4, "ACESSO RECUSADO POR PENDÊNCIA CADASTRAL.");
            }

            break;
        }

        case 5: {

            let horas = numero("q5a");

            if (horas < 0 || !Number.isFinite(horas)) {
                resultado(5, "Tempo inválido.");
                return;
            }

            let categoria;
            let valorPago;

            if (horas <= 0.5) {
                categoria = "Tolerância";
                valorPago = 0;
            } else if (horas <= 2) {
                categoria = "Curta permanência";
                valorPago = 10;
            } else if (horas <= 5) {
                categoria = "Permanência média";
                valorPago = 20;
            } else {
                categoria = "Longa permanência";
                valorPago = 35;
            }
